<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MFR | Coming Soon</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: Arial, sans-serif;
    color: #ffffff;
    background:
        radial-gradient(circle at top right, #26395e 0%, transparent 40%),
        linear-gradient(135deg, #0B132B, #1C2541);
    padding: 25px;
}

.container {
    max-width: 650px;
}

.logo {
    font-size: 58px;
    font-weight: 900;
    letter-spacing: 8px;
    margin-bottom: 35px;
}

.logo span {
    color: #72a7ff;
}

.line {
    width: 75px;
    height: 4px;
    background: #72a7ff;
    margin: 0 auto 30px;
    border-radius: 10px;
}

h1 {
    font-size: clamp(35px, 7vw, 58px);
    margin-bottom: 20px;
    line-height: 1.15;
}

h1 span {
    color: #72a7ff;
}

p {
    color: #c7d0de;
    font-size: 17px;
    line-height: 1.8;
}

.badge {
    display: inline-block;
    margin-top: 30px;
    padding: 12px 22px;
    border: 1px solid #526b96;
    border-radius: 30px;
    color: #dce8ff;
    font-size: 13px;
    letter-spacing: 2px;
}

footer {
    margin-top: 65px;
    color: #9ba9c2;
    font-size: 13px;
}
</style>
</head>

<body>
<div class="container">

    <div class="logo">MFR<span>.</span></div>

    <div class="line"></div>

    <h1>We’ll Be Back <span>Shortly.</span></h1>

    <p>
        We're currently working behind the scenes
        to make our website even better for you.
        <br>
        Something amazing is coming. Stay tuned!
    </p>

    <div class="badge">WEBSITE UNDER MAINTENANCE</div>

    <footer>© 2026 MFR. All Rights Reserved.</footer>

</div>
</body>
</html>
